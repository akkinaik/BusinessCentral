name: BC App CI — Build & Package

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Compile & Package BCTrainingApp
    runs-on: windows-latest
    timeout-minutes: 60

    steps:

    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 📖 Read app.json Metadata
      shell: pwsh
      run: |
        $appJson    = Get-Content 'BCTrainingApp/app.json' | ConvertFrom-Json
        echo "APP_NAME=$($appJson.name)"       >> $env:GITHUB_ENV
        echo "APP_VERSION=$($appJson.version)" >> $env:GITHUB_ENV
        echo "PUBLISHER=$($appJson.publisher)" >> $env:GITHUB_ENV
        Write-Host "App: $($appJson.name) v$($appJson.version)"

    - name: 📦 Install BcContainerHelper
      shell: pwsh
      run: |
        Install-Module BcContainerHelper -Force -AllowClobber -Scope CurrentUser
        Write-Host "✅ BcContainerHelper installed"

    - name: 🔨 Download BC Artifacts & Compile AL App
      shell: pwsh
      run: |
        Import-Module BcContainerHelper

        $outputFolder = Join-Path $env:GITHUB_WORKSPACE 'output'
        New-Item -ItemType Directory -Force -Path $outputFolder | Out-Null

        # Get + download BC artifact (includes alc.exe compiler)
        $artifactUrl = Get-BCArtifactUrl -type Sandbox -country W1 -select Current
        Write-Host "Artifact: $artifactUrl"

        $folders = Download-Artifacts -artifactUrl $artifactUrl -includePlatform
        $platformFolder = $folders[1]

        # Find alc.exe
        $alc = Get-ChildItem -Path $platformFolder -Filter 'alc.exe' -Recurse | Select-Object -First 1
        if (-not $alc) { throw "❌ alc.exe not found!" }
        Write-Host "✅ Compiler: $($alc.FullName)"

        # Set up .alpackages with BC symbols
        $appProjectFolder = Join-Path $env:GITHUB_WORKSPACE 'BCTrainingApp'
        $alcPackagesFolder = Join-Path $appProjectFolder '.alpackages'
        New-Item -ItemType Directory -Force -Path $alcPackagesFolder | Out-Null

        $symbolsSource = Join-Path $folders[0] 'Applications'
        if (Test-Path $symbolsSource) {
          Get-ChildItem -Path $symbolsSource -Filter '*.app' -Recurse |
            ForEach-Object { Copy-Item $_.FullName -Destination $alcPackagesFolder -Force }
          Write-Host "✅ Symbols copied"
        }

        # Compile
        & $alc.FullName @(
          "/project:$appProjectFolder"
          "/packagecachepath:$alcPackagesFolder"
          "/out:$outputFolder"
        )

        if ($LASTEXITCODE -ne 0) { throw "❌ Compilation failed (exit $LASTEXITCODE)" }
        Write-Host "✅ Compilation done!"
        echo "OUTPUT_FOLDER=$outputFolder" >> $env:GITHUB_ENV

    - name: 🔍 Verify .app File
      shell: pwsh
      run: |
        $apps = Get-ChildItem $env:OUTPUT_FOLDER -Filter '*.app'
        if ($apps.Count -eq 0) { Write-Error "❌ No .app file found!"; exit 1 }
        $apps | ForEach-Object {
          Write-Host "✅ $($_.Name)  ($([math]::Round($_.Length/1KB,1)) KB)"
        }

    - name: 📤 Upload .app Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BCTrainingApp-${{ env.APP_VERSION }}
        path: output/*.app
        retention-days: 30
        if-no-files-found: error
