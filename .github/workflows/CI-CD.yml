name: 'App CI'

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'Dev', 'Test' ]

permissions:
  contents: read
  actions: read

jobs:
  Build:
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AL-Go Build
        uses: microsoft/AL-Go-Actions/RunPipeline@v8.3
        with:
          shell: powershell
          token: ${{ secrets.GITHUB_TOKEN }}
          project: BCTrainingApp
          buildMode: Default
          parentTelemetryScopeJson: '{}'    # ← this is what was missing

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BCTrainingApp_Package
          path: ./**/*.app
