name: 'App CI'

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'Dev', 'Test' ]

permissions:
  contents: read

jobs:
  Build:
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Business Central App
        uses: microsoft/AL-Go-Actions/Compile-App@v8.3
        with:
          shell: powershell
          project: '.'
