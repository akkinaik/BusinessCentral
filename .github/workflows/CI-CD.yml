name: 'App CI'

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'Dev', 'Test' ]

permissions:
  contents: read
  actions: read

jobs:
  Build:
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This is the "Master" action that solves the path errors
      - name: Run AL-Go Build
        uses: microsoft/AL-Go-Actions/RunPipeline@v8.3
        with:
          shell: powershell
          project: BCTrainingApp
          buildMode: Default

      # Upload the .app file created by the pipeline
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BCTrainingApp_Package
          path: ./**/*.app
