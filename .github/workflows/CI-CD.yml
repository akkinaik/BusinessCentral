name: 'App CI - Multi Project'

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'Dev', 'Test' ]

permissions:
  contents: read
  actions: read

jobs:
  Initialization:
    runs-on: [ windows-latest ]
    outputs:
      projects: ${{ steps.determineProjects.outputs.ProjectsJson }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Workflow
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v8.3
        with:
          shell: powershell

      - name: Determine Projects
        id: determineProjects
        uses: microsoft/AL-Go-Actions/DetermineProjectsToBuild@v8.3
        with:
          shell: powershell
          maxBuildDepth: 2

  Build:
    needs: [ Initialization ]
    if: ${{ needs.Initialization.outputs.projects != '[]' && needs.Initialization.outputs.projects != '' }}
    strategy:
      matrix:
        project: ${{ fromJson(needs.Initialization.outputs.projects) }}
      fail-fast: false
    runs-on: [ windows-latest ]
    name: Build ${{ matrix.project.projectName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Workflow
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v8.3
        with:
          shell: powershell

      - name: Compile App
        uses: microsoft/AL-Go-Actions/Compile-App@v8.3
        with:
          shell: powershell
          project: ${{ matrix.project.project }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.projectName }}_Package
          path: ${{ matrix.project.project }}/*.app
