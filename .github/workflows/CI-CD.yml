name: 'App CI'

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'Dev', 'Test' ]

permissions:
  contents: read
  actions: read

jobs:
  Build:
    runs-on: [ windows-latest ] # CRITICAL: Must be Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v8.3
        with:
          shell: powershell

      - name: Build
        uses: microsoft/AL-Go-Actions/Compile-App@v8.3
        with:
          shell: powershell
          project: './BCTrainingApp'

      # 3. Upload the .app package so you can download it
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BCTrainingApp_Package
          path: BCTrainingApp/*.app
          if-no-files-found: error
