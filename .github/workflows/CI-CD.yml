name: 'App CI'

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'Dev', 'Test' ]

permissions:
  contents: read
  actions: read

jobs:
  Build:
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. This sets up the compiler & environment variables
      - name: Initialize AL-Go
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v8.3
        with:
          shell: powershell

      # 2. Direct call to the compiler sub-action (This avoids the line 78 crash)
      - name: Compile BCTrainingApp
        uses: microsoft/AL-Go-Actions/Compile-App/Compile-App.Action@v8.3
        with:
          shell: powershell
          project: './BCTrainingApp'

      # 3. Upload the deployable .app package
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BCTrainingApp_Package
          path: BCTrainingApp/*.app
