name: 'App CI - Create Package'

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'Dev', 'Test' ]

permissions:
  contents: read
  actions: read

jobs:
  Build:
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Initialize the AL-Go environment (Required)
      - name: Initialize Workflow
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v8.3
        with:
          shell: powershell

      # 2. Determine which projects to build based on your app.json
      - name: Determine Projects
        uses: microsoft/AL-Go-Actions/DetermineProjectsToBuild@v8.3
        id: determineProjects
        with:
          shell: powershell

      # 3. Compile the App and Create the .app package
      - name: Build and Package
        uses: microsoft/AL-Go-Actions/Compile-App@v8.3
        with:
          shell: powershell
          project: '.'
          # This ensures it creates a 'Runtime' package if needed
          buildMode: 'Default' 

      # 4. Upload the .app file so you can download it from GitHub
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BusinessCentral_App_Package
          path: |
            ./*.app
            ./bin/*.app
          if-no-files-found: error
