name: 'App CI'

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'Dev', 'Test' ]

permissions:
  contents: read
  actions: read

jobs:
  Build:
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 1. Initialize the AL-Go environment (Required for BC v27.5)
      - name: Initialize Workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v8.3
        with:
          shell: powershell

      # 2. Build the Business Central App from your subfolder
      - name: Build Business Central App
        uses: microsoft/AL-Go-Actions/Compile-App@v8.3
        with:
          shell: powershell
          project: './BCTrainingApp'
          buildMode: 'Default'

      # 3. Upload the .app package so you can download it
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BCTrainingApp_Package
          path: BCTrainingApp/*.app
          if-no-files-found: error
