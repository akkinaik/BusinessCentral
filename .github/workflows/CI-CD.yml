name: 'App CI - Multi Project'

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'Dev', 'Test' ]

permissions:
  contents: read
  actions: read

jobs:
  Build:
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This sets up the AL compiler environment without the telemetry crash
      - name: Initialize Workflow
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v8.3
        with:
          shell: powershell

      # We manually find all folders containing an app.json and build them
      - name: Build All Projects
        shell: powershell
        run: |
          $projects = Get-ChildItem -Path . -Filter "app.json" -Recurse
          foreach ($project in $projects) {
              $projectDir = $project.DirectoryName
              Write-Host "Building project in: $projectDir"
              
              # Call the compiler directly for this folder
              uses: microsoft/AL-Go-Actions/Compile-App@v8.3
              with:
                shell: powershell
                project: $projectDir
          }

      - name: Upload All App Packages
        uses: actions/upload-artifact@v4
        with:
          name: BC-Deployable-Packages
          path: |
            **/*.app
          if-no-files-found: error
