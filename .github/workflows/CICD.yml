name: CI/CD

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
#      - '.github/workflows/*.yaml'
 #     - '.github/workflows/*.yml'
    branches:
      - main
      - Dev
      - Test
  pull_request:
    branches:
      - main
      - Dev
      - Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell

permissions:
  contents: read
  actions: read

jobs:
  Initialization:
    runs-on: [ windows-latest ]
    outputs:
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
      settings:           ${{ steps.ReadSettings.outputs.SettingsJson }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v8.3
        with:
          shell: powershell

      - name: Read settings
        id: ReadSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v8.3
        with:
          shell: powershell

      # Debug — see what AL-Go detected
      - name: 🔍 Debug Outputs
        shell: powershell
        run: |
          Write-Host "Settings : ${{ steps.ReadSettings.outputs.SettingsJson }}"
          Write-Host "Projects : ${{ steps.ReadSettings.outputs.ProjectsJson }}"
          Write-Host "Count    : ${{ steps.ReadSettings.outputs.ProjectCount }}"

  Build:
    needs: [ Initialization ]
    runs-on: [ windows-latest ]
    # ✅ No if-condition, no matrix — always runs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: microsoft/AL-Go-Actions/RunPipeline@v8.3
        with:
          shell:        powershell
          project:      'BCTrainingApp'    # ✅ hardcoded — no matrix needed
          settingsJson: ${{ needs.Initialization.outputs.settings }}
